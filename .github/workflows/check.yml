name: check

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the latest CLIs, to catch a release that breaks a plugin
  # even when nothing here changed.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DISABLE_AUTOUPDATER: "1"

jobs:
  claude-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: claude --version
      - run: scripts/check-claude.sh

  qwen-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g @qwen-code/qwen-code@latest
      - run: qwen --version
      - run: scripts/check-qwen.sh

  version-bump:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/check-version-bump.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
