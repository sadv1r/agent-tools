name: update-bento

# Weekly: pull the latest bento.page files into plugins/bento-slides and open
# (or refresh) a pull request with them.
on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # to start the check workflow on the PR branch

concurrency: update-bento

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: update
        run: scripts/update-bento.sh "$RUNNER_TEMP/pr-body.md"

      - id: pr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/bento-slides
          delete-branch: true
          add-paths: |
            plugins/bento-slides
            upstream/bento-slides
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          body-path: ${{ runner.temp }}/pr-body.md

      # A PR opened with GITHUB_TOKEN doesn't trigger pull_request workflows,
      # but a dispatched run on the branch reports its checks on the PR.
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run check.yml --ref update/bento-slides
        env:
          GH_TOKEN: ${{ github.token }}
