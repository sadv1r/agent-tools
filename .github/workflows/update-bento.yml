name: update-bento

# Weekly: pull the latest bento.page files into plugins/bento-slides and open
# (or refresh) a pull request with them.
on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: update-bento

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: update
        run: scripts/update-bento.sh "$RUNNER_TEMP/pr-body.md"

      # With the default token, the PR's check run waits for "Approve workflows
      # to run". A fine-grained PAT (Contents + Pull requests: read/write on this
      # repo) in the AGENT_TOOLS_PR_TOKEN secret makes the checks start on their own.
      - if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AGENT_TOOLS_PR_TOKEN || github.token }}
          branch: update/bento-slides
          delete-branch: true
          add-paths: |
            plugins/bento-slides
            upstream/bento-slides
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          body-path: ${{ runner.temp }}/pr-body.md
